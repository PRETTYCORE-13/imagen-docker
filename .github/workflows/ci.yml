name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  ELIXIR_VERSION: "1.18.4"
  OTP_VERSION: "28.1"

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      MIX_ENV: test

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: crm_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-

      - name: Instalar dependencias
        run: mix deps.get

      - name: Crear y migrar base de test
        run: |
          mix ecto.create
          mix ecto.migrate

      - name: Compilar sin warnings
        run: mix compile --warning-as-errors

      - name: Test
        run: mix test

  # Solo corre si "validate" pasó. Mismo patrón que metadata_stack (ver
  # ese repo, .github/workflows/ci.yml): arma la imagen con el Dockerfile
  # de "mix phx.gen.release --docker" y la publica en GitHub Container
  # Registry.
  build-image:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Nombre de imagen para ghcr.io (minúsculas, sin separador final)
        run: |
          repo="${GITHUB_REPOSITORY,,}"
          repo="${repo%[-._]}"
          echo "IMAGE_NAME=$repo" >> "$GITHUB_ENV"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_NAME }}:latest
            ghcr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}

  # Solo corre si "build-image" publicó la imagen nueva. Actualiza el
  # Deployment "crm" en el namespace "panel-control" (dado de alta a mano
  # desde Panel Control, 2026-08-31 -- ver metadata_stack,
  # MetadataApp.PanelControl.Desplegador) y corre las migraciones --
  # mismo patrón que el job "deploy" de metadata_stack, pero apuntando a
  # este namespace/deployment y usando /app/bin/migrate (no existe un
  # "setup" acá, solo el que genera "mix phx.gen.release --docker").
  # Requiere 3 secrets en el repo (Settings -> Secrets and variables ->
  # Actions): DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY (privada, ed25519,
  # dedicada a este deploy) -- ninguno vive acá ni en ningún archivo
  # versionado, el repo es público.
  deploy:
    needs: build-image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Actualizar crm en k3s y migrar
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            sudo k3s kubectl rollout restart deployment/crm -n panel-control
            sudo k3s kubectl rollout status deployment/crm -n panel-control --timeout=120s

            POD=$(sudo k3s kubectl get pod -n panel-control -l app=crm -o jsonpath='{.items[0].metadata.name}')
            if [ -z "$POD" ]; then
              echo "No se encontró el pod de crm, no se pudo migrar"
              exit 1
            fi
            sudo k3s kubectl exec -n panel-control "$POD" -- /app/bin/migrate
